apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-service
  labels:
    app: event-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: event-service
  template:
    metadata:
      labels:
        app: event-service
      annotations:
        sidecar.istio.io/inject: "true"
    spec:
      containers:
        - name: event-service
          image: event-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8092
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: SERVER_PORT
              value: "8092"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "host.docker.internal:9094,host.docker.internal:9095"
            - name: OPENSEARCH_HOST
              value: "host.docker.internal"
            - name: OPENSEARCH_PORT
              value: "9200"
            - name: POSTGRES_HOST
              value: "host.docker.internal"
            - name: POSTGRES_PORT
              value: "5432"
            - name: KEYCLOAK_ISSUER_URI
              value: "http://kubernetes.docker.internal:8082/realms/ticketmaster"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8092
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8092
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: event-service
  labels:
    app: event-service
spec:
  selector:
    app: event-service
  ports:
    - name: http
      port: 8092
      targetPort: 8092
  type: ClusterIP
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: event-service
spec:
  host: event-service
  trafficPolicy:
    loadBalancer:
      simple: ROUND_ROBIN


