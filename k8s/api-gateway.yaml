apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
      annotations:
        sidecar.istio.io/inject: "true"
    spec:
      containers:
        - name: api-gateway
          image: api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: SERVER_PORT
              value: "8080"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "host.docker.internal:9094,host.docker.internal:9095"
            - name: OPENSEARCH_HOST
              value: "host.docker.internal"
            - name: OPENSEARCH_PORT
              value: "9200"
            - name: KEYCLOAK_ISSUER_URI
              value: "http://kubernetes.docker.internal:8082/realms/ticketmaster"
            - name: EVENT_SERVICE_URL
              value: "http://event-service:8092"
            - name: BOOKING_SERVICE_URL
              value: "http://booking-service:8094"
            - name: PAYMENT_SERVICE_URL
              value: "http://payment-service:8096"
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  labels:
    app: api-gateway
spec:
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: api-gateway
spec:
  host: api-gateway
  trafficPolicy:
    loadBalancer:
      simple: ROUND_ROBIN
