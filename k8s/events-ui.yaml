apiVersion: v1
kind: ConfigMap
metadata:
  name: events-ui-config
data:
  config.json: |
    {
      "useMockApi": false,
      "enableSecurity": true,
      "baseUrl": "http://app.local",
      "keycloak": {
        "url": "http://kubernetes.docker.internal:8082",
        "realm": "ticketmaster",
        "clientId": "ui-client"
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: events-ui
  labels:
    app: events-ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: events-ui
  template:
    metadata:
      labels:
        app: events-ui
    spec:
      containers:
      - name: events-ui
        image: events-ui:latest
        imagePullPolicy: IfNotPresent
        volumeMounts:
        - name: ui-runtime-config
          mountPath: /usr/share/nginx/html/assets/config.json
          subPath: config.json
          readOnly: true
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: ui-runtime-config
        configMap:
          name: events-ui-config
---
apiVersion: v1
kind: Service
metadata:
  name: events-ui-service
  labels:
    app: events-ui
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: events-ui
