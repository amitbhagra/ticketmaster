spring:
  application:
    name: booking-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:host.docker.internal}:${POSTGRES_PORT:5432}/mydb?currentSchema=booking_service
    username: booking_service_role
    password: secure_booking_password
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        default_schema: booking_service
    hibernate:
      ddl-auto: validate
  h2:
    console:
      enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          # Use one env var across environments; must exactly match token 'iss'
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8082/realms/ticketmaster}
server:
  port: 8094

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers,threaddump,heapdump
  endpoint:
    heapdump:
        enabled: true
    health:
      show-details: when-authorized
kafka:
  bootstrap:
    servers: ${KAFKA_BOOTSTRAP_SERVERS:host.docker.internal:9094,host.docker.internal:9095}