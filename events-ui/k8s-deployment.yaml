apiVersion: apps/v1
kind: Deployment
metadata:
  name: events-ui
  labels:
    app: events-ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: events-ui
  template:
    metadata:
      labels:
        app: events-ui
    spec:
      containers:
      - name: events-ui
        image: events-ui:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: events-ui-service
  labels:
    app: events-ui
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: events-ui
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: events-ui-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: events-ui.example.com  # Replace with your domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: events-ui-service
            port:
              number: 80
